# ESP-IDF Component Manager manifest for the `main` component.
#
# Note: ESP-IDF's component manager reads idf_component.yml per-component
# (main/idf_component.yml, components/<name>/idf_component.yml), not from the
# project root — this is why it lives here rather than at the repo root shown in
# the original spec's illustrative tree.
#
# Managed dependencies (e.g. esp32-camera, esp-video, esp-dl) are added here phase
# by phase, pinned to an exact version, as each phase needs them.
dependencies:
  idf: ">=5.3"
  # ESP32-P4 has no native WiFi radio - connectivity goes through the
  # ESP32-C6 co-processor via a "remote" transport. esp_wifi_remote provides
  # the standard esp_wifi API on top of that transport so telegramp4_wifi
  # doesn't need P4-specific code. See docs/hardware.md and
  # sdkconfig.defaults (CONFIG_ESP_WIFI_REMOTE_LIBRARY_HOSTED).
  espressif/esp_wifi_remote:
    version: ">=0.1.12"
    rules:
      - if: "target in [esp32p4, esp32h2]"
