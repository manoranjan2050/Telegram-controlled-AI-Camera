<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#182338"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4fd672"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="url(#sf-bg)" rx="14"/>
  <text x="600" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2f6ff" text-anchor="middle">Zero-rebuild setup: flash once, configure from any browser</text>

  <!-- Step 1: flash -->
  <g transform="translate(40,70)">
    <rect width="250" height="170" rx="16" fill="#132038" stroke="#2c4066" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#29b6f6"/>
    <text x="30" y="35" font-family="Segoe UI" font-size="14" font-weight="700" fill="#0d1526" text-anchor="middle">1</text>
    <rect x="90" y="45" width="70" height="90" rx="8" fill="#0d1526" stroke="#3a4f7a" stroke-width="2"/>
    <path d="M115 70 l20 20 M135 70 l-20 20" stroke="#7ee0ff" stroke-width="3" stroke-linecap="round"/>
    <text x="125" y="150" font-family="Consolas,monospace" font-size="10" fill="#7ee0ff" text-anchor="middle">idf.py flash</text>
    <text x="125" y="160" font-family="Segoe UI" font-size="12.5" font-weight="600" fill="#f2f6ff" text-anchor="middle"> </text>
    <text x="125" y="16" font-family="Segoe UI" font-size="13" font-weight="600" fill="#f2f6ff" text-anchor="middle"></text>
  </g>
  <text x="165" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2f6ff" text-anchor="middle">Flash the firmware</text>
  <text x="165" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7d93c2" text-anchor="middle">no credentials needed yet</text>

  <line x1="298" y1="155" x2="345" y2="155" stroke="#4fd672" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrow2)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Step 2: connect to AP -->
  <g transform="translate(350,70)">
    <rect width="250" height="170" rx="16" fill="#132038" stroke="#2c4066" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#29b6f6"/>
    <text x="30" y="35" font-family="Segoe UI" font-size="14" font-weight="700" fill="#0d1526" text-anchor="middle">2</text>
    <path d="M105 90 q20 -30 40 0" stroke="#7ee0ff" stroke-width="3" fill="none"/>
    <path d="M113 98 q12 -18 24 0" stroke="#7ee0ff" stroke-width="3" fill="none"/>
    <circle cx="125" cy="106" r="4" fill="#7ee0ff"/>
    <rect x="80" y="115" width="90" height="22" rx="6" fill="#0d1526" stroke="#3a4f7a"/>
    <text x="125" y="130" font-family="Consolas,monospace" font-size="8.5" fill="#7ee0ff" text-anchor="middle">TelegramP4-Setup</text>
  </g>
  <text x="475" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2f6ff" text-anchor="middle">Connect your phone to it</text>
  <text x="475" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7d93c2" text-anchor="middle">the device becomes a Wi-Fi hotspot</text>

  <line x1="608" y1="155" x2="655" y2="155" stroke="#4fd672" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrow2)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Step 3: fill the form -->
  <g transform="translate(660,70)">
    <rect width="250" height="170" rx="16" fill="#132038" stroke="#2c4066" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#29b6f6"/>
    <text x="30" y="35" font-family="Segoe UI" font-size="14" font-weight="700" fill="#0d1526" text-anchor="middle">3</text>
    <rect x="75" y="45" width="100" height="98" rx="8" fill="#0d1526" stroke="#3a4f7a" stroke-width="2"/>
    <rect x="87" y="58" width="76" height="12" rx="3" fill="#1c2942"/>
    <rect x="87" y="76" width="76" height="12" rx="3" fill="#1c2942"/>
    <rect x="87" y="94" width="76" height="12" rx="3" fill="#1c2942"/>
    <rect x="87" y="118" width="76" height="16" rx="8" fill="#29b6f6"/>
    <text x="125" y="129" font-family="Segoe UI" font-size="8" font-weight="700" fill="#0d1526" text-anchor="middle">SAVE</text>
  </g>
  <text x="785" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2f6ff" text-anchor="middle">Open 192.168.4.1</text>
  <text x="785" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7d93c2" text-anchor="middle">enter Wi-Fi + Telegram bot token</text>

  <line x1="918" y1="155" x2="965" y2="155" stroke="#4fd672" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrow2)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Step 4: done -->
  <g transform="translate(970,70)">
    <rect width="190" height="170" rx="16" fill="#12331f" stroke="#2f7d4f" stroke-width="1.5"/>
    <circle cx="95" cy="70" r="34" fill="#173e27" stroke="#4fd672" stroke-width="2"/>
    <path d="M78 70 l12 12 24 -24" stroke="#4fd672" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,60;60,60" dur="0.6s" fill="freeze"/>
    </path>
  </g>
  <text x="1065" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2f6ff" text-anchor="middle">Reboots &amp; connects</text>
  <text x="1065" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7d93c2" text-anchor="middle">ready in your Telegram chat</text>
</svg>
