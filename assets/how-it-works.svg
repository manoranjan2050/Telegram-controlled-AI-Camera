<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#182338"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#29b6f6"/>
    </marker>
  </defs>
  <rect width="1200" height="360" fill="url(#hw-bg)" rx="14"/>
  <text x="600" y="42" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f2f6ff" text-anchor="middle">How a command travels from your phone to the camera and back</text>

  <!-- Step 1: Phone -->
  <g transform="translate(40,110)">
    <rect width="190" height="150" rx="16" fill="#132038" stroke="#2c4066" stroke-width="1.5"/>
    <rect x="55" y="20" width="80" height="115" rx="12" fill="#0d1526" stroke="#3a4f7a" stroke-width="2"/>
    <rect x="63" y="32" width="64" height="80" rx="4" fill="#101a30"/>
    <rect x="80" y="118" width="30" height="4" rx="2" fill="#3a4f7a"/>
    <!-- chat bubble -->
    <rect x="66" y="42" width="52" height="16" rx="6" fill="#29b6f6"/>
    <text x="92" y="53" font-family="Consolas,monospace" font-size="7.5" fill="#0d1526" text-anchor="middle">/photo</text>
    <text x="95" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f2f6ff" text-anchor="middle">You, in Telegram</text>
  </g>

  <line x1="235" y1="185" x2="315" y2="185" stroke="#29b6f6" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
  </line>
  <text x="275" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7d93c2" text-anchor="middle">HTTPS</text>

  <!-- Step 2: Telegram Cloud -->
  <g transform="translate(320,110)">
    <rect width="190" height="150" rx="16" fill="#132038" stroke="#2c4066" stroke-width="1.5"/>
    <g transform="translate(60,25)">
      <circle cx="35" cy="35" r="35" fill="#29b6f6" opacity="0.15"/>
      <path d="M12 36 L58 18 L44 55 L34 42 L22 47 Z" fill="#29b6f6"/>
    </g>
    <text x="95" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f2f6ff" text-anchor="middle">Telegram Cloud</text>
    <text x="95" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7d93c2" text-anchor="middle">Bot API</text>
  </g>

  <line x1="515" y1="185" x2="595" y2="185" stroke="#29b6f6" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
  </line>
  <text x="555" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7d93c2" text-anchor="middle">long-poll</text>

  <!-- Step 3: ESP32-C6 WiFi coprocessor -->
  <g transform="translate(600,110)">
    <rect width="190" height="150" rx="16" fill="#132038" stroke="#2c4066" stroke-width="1.5"/>
    <rect x="65" y="30" width="60" height="60" rx="8" fill="#0d1526" stroke="#7ee0ff" stroke-width="2"/>
    <text x="95" y="66" font-family="Consolas,monospace" font-size="9" fill="#7ee0ff" text-anchor="middle">Wi-Fi</text>
    <path d="M75 40 q20 -18 40 0" stroke="#29b6f6" stroke-width="2" fill="none"/>
    <path d="M82 48 q13 -11 26 0" stroke="#29b6f6" stroke-width="2" fill="none"/>
    <circle cx="95" cy="56" r="3" fill="#29b6f6"/>
    <text x="95" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f2f6ff" text-anchor="middle">ESP32-C6</text>
    <text x="95" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7d93c2" text-anchor="middle">Wi-Fi co-processor</text>
  </g>

  <line x1="795" y1="185" x2="875" y2="185" stroke="#29b6f6" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
  </line>
  <text x="835" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7d93c2" text-anchor="middle">SDIO</text>

  <!-- Step 4: ESP32-P4 brain -->
  <g transform="translate(880,90)">
    <rect width="230" height="190" rx="16" fill="#152444" stroke="#29b6f6" stroke-width="2"/>
    <rect x="80" y="18" width="70" height="70" rx="10" fill="#0d1526" stroke="#7ee0ff" stroke-width="2"/>
    <circle cx="115" cy="53" r="18" fill="#101a30" stroke="#29b6f6" stroke-width="2"/>
    <circle cx="115" cy="53" r="7" fill="#29b6f6">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="115" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f6ff" text-anchor="middle">ESP32-P4</text>
    <text x="115" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#9fb3d9" text-anchor="middle">runs this firmware</text>
    <!-- mini peripheral row -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#7ee0ff">
      <rect x="14" y="146" width="58" height="26" rx="7" fill="#0d1526" stroke="#2c4066"/>
      <text x="43" y="163" text-anchor="middle">📷 CSI</text>
      <rect x="86" y="146" width="58" height="26" rx="7" fill="#0d1526" stroke="#2c4066"/>
      <text x="115" y="163" text-anchor="middle">🎙 PDM</text>
      <rect x="158" y="146" width="58" height="26" rx="7" fill="#0d1526" stroke="#2c4066"/>
      <text x="187" y="163" text-anchor="middle">💾 SD</text>
    </g>
  </g>

  <!-- return path -->
  <path d="M995 280 C 700 340, 300 340, 95 265" stroke="#7c4dff" stroke-width="2.5" stroke-dasharray="5 7" fill="none" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b9a6ff" text-anchor="middle">Photo / audio / status sent straight back to your chat</text>
</svg>
