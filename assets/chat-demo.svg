<svg width="380" height="640" viewBox="0 0 380 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chatbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1621"/>
      <stop offset="100%" stop-color="#131c28"/>
    </linearGradient>
    <clipPath id="round"><rect width="380" height="640" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="380" height="640" fill="url(#chatbg)"/>

    <!-- header -->
    <rect width="380" height="64" fill="#17212b"/>
    <circle cx="34" cy="32" r="18" fill="#29b6f6"/>
    <path d="M25 33 L45 24 L38 44 L32 36 L27 39 Z" fill="#0e1621"/>
    <text x="60" y="27" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#f2f6ff">ESP32-P4 AI Camera</text>
    <text x="60" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5fb2e8">bot</text>

    <!-- timestamp -->
    <text x="190" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6b7c" text-anchor="middle">Today</text>

    <!-- incoming: welcome -->
    <g transform="translate(16,104)">
      <rect width="230" height="58" rx="14" fill="#182533"/>
      <text x="14" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef3f8">Welcome to TelegramP4! 📷</text>
      <text x="14" y="43" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9fb3d9">Use /help to see commands.</text>
    </g>

    <!-- outgoing: /photo -->
    <g transform="translate(258,176)">
      <rect width="106" height="34" rx="14" fill="#2b5278"/>
      <text x="53" y="22" font-family="Consolas,monospace" font-size="12.5" fill="#eef3f8" text-anchor="middle">/photo</text>
    </g>

    <!-- incoming: photo card -->
    <g transform="translate(16,222)">
      <rect width="230" height="150" rx="14" fill="#182533"/>
      <rect x="10" y="10" width="210" height="112" rx="8" fill="#0d3350"/>
      <!-- little scene inside photo -->
      <rect x="10" y="10" width="210" height="112" rx="8" fill="#0d3350"/>
      <circle cx="60" cy="95" r="26" fill="#154a70"/>
      <circle cx="170" cy="45" r="16" fill="#f2c14e" opacity="0.85"/>
      <path d="M10 122 L80 70 L130 100 L170 60 L220 90 L220 122 Z" fill="#123a5c"/>
      <text x="115" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9fb3d9" text-anchor="middle">photo_1788958050.jpg</text>
    </g>

    <!-- outgoing: /status -->
    <g transform="translate(248,386)">
      <rect width="116" height="34" rx="14" fill="#2b5278"/>
      <text x="58" y="22" font-family="Consolas,monospace" font-size="12.5" fill="#eef3f8" text-anchor="middle">/status</text>
    </g>

    <!-- incoming: status card -->
    <g transform="translate(16,432)">
      <rect width="260" height="132" rx="14" fill="#182533"/>
      <text x="14" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#eef3f8">📊 System Status</text>
      <g font-family="Consolas,monospace" font-size="11" fill="#9fb3d9">
        <text x="14" y="46">Wi-Fi</text><text x="240" y="46" text-anchor="end" fill="#4fd672">✓ 192.168.1.42</text>
        <text x="14" y="66">Camera</text><text x="240" y="66" text-anchor="end" fill="#4fd672">✓ 800x800</text>
        <text x="14" y="86">SD Card</text><text x="240" y="86" text-anchor="end" fill="#4fd672">✓ 2.1 / 7.4 GB</text>
        <text x="14" y="106">Uptime</text><text x="240" y="106" text-anchor="end" fill="#eef3f8">3h 42m</text>
      </g>
    </g>

    <!-- input bar -->
    <rect y="588" width="380" height="52" fill="#17212b"/>
    <rect x="16" y="602" width="300" height="26" rx="13" fill="#0e1621"/>
    <text x="30" y="619" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b7c">Message</text>
    <circle cx="348" cy="615" r="18" fill="#29b6f6"/>
    <path d="M341 615 l14 0 M349 608 l6 7 -6 7" stroke="#0e1621" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="1" y="1" width="378" height="638" rx="26" fill="none" stroke="#2c3b5c" stroke-width="2"/>
</svg>
